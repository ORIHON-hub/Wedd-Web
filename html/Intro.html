<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Page</title>
  <link rel="prefetch" href="WeddInv.html">   <!-- loads the next page in the background so the transition is instant -->
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4a85a;
    }

    :root {
      --ratio: 1.78;
      --sh: max(100dvh, calc(100vw / var(--ratio)));
      --sw: calc(var(--sh) * var(--ratio));
      --sx: calc((100vw - var(--sw)) / 2);
    }

    @media (orientation: portrait) {
      :root { --sx: 0px; }
    }

    .bg {
      position: fixed;
      bottom: 0;
      left: var(--sx);
      width: var(--sw);
      height: var(--sh);
      z-index: 0;
    }

    .rider {
      --cycle: 0.5s;
      --ride-speed: 5.8s;
      --rw: min(calc(var(--sw) * 0.32), 95vw);
      position: fixed;
      z-index: 1;
      left: 0;
      bottom: calc(var(--sh) * 0.03);
      width: var(--rw);
      aspect-ratio: 1 / 1;
      animation: rideLeft var(--ride-speed) linear 1 forwards;
    }

    @media (orientation: portrait) {
      .rider { --ride-speed: 4s; }
    }

    .rider img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      animation: showFrame var(--cycle) steps(1) infinite;
    }

    .rider img:nth-child(1) { animation-delay: 0s; }
    .rider img:nth-child(2) { animation-delay: calc(var(--cycle) * -0.8); }
    .rider img:nth-child(3) { animation-delay: calc(var(--cycle) * -0.6); }
    .rider img:nth-child(4) { animation-delay: calc(var(--cycle) * -0.4); }
    .rider img:nth-child(5) { animation-delay: calc(var(--cycle) * -0.2); }

    @keyframes showFrame {
      0%   { opacity: 1; }
      20%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes rideLeft {
      from { transform: translateX(100vw); }
      to   { transform: translateX(-100%); }
    }

    /* the letter: hidden until the rider reaches the middle of the screen */
    .letter {
      --lw: min(calc(var(--sw) * 0.32), 95vw);   /* same size as the rider */
      display: none;
      position: fixed;
      z-index: 2;
      bottom: calc(var(--sh) * 0.03);            /* same height as the rider */
      width: var(--lw);
      aspect-ratio: 1 / 1;
      transform: translateX(-50%);               /* centers it on the drop point */
      pointer-events: none;                      /* not clickable while falling */
    }

    /* after the drop finishes, the letter can be clicked */
    .letter.ready {
      pointer-events: auto;
      cursor: pointer;
    }
    .letter.ready:hover {
      filter: brightness(1.08);
    }

    /* smooth fade into the next page */
    .fade {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #fff6e8;                       /* color the screen fades to */
      opacity: 0;
      pointer-events: none;
    }
    .fade.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <img class="bg" src="../image/Bantayan Island Sunset Road BG.png" alt="">

  <div class="rider">
    <img src="../image/frame_02-removebg-preview.png" alt="">
    <img src="../image/frame_03-removebg-preview.png" alt="">
    <img src="../image/frame_04-removebg-preview.png" alt="">
    <img src="../image/frame_05-removebg-preview.png" alt="">
    <img src="../image/frame_06-removebg-preview.png" alt="Couple on a motorcycle">
  </div>

  <img class="letter" src="../image/Lframe1.png" alt="Letter">

  <div class="fade"></div>

  <script>
    // ---------- background ratio ----------
    const bg = document.querySelector('.bg');
    function setRatio() {
      if (bg.naturalWidth) {
        document.documentElement.style.setProperty('--ratio', bg.naturalWidth / bg.naturalHeight);
      }
    }
    if (bg.complete) setRatio();
    bg.addEventListener('load', setRatio);

    // ---------- settings ----------
    const OPEN_PAGE = 'WeddInv.html';                                   // the next page
    const OPEN_GIF = '../image/Animated_Love_Letter_Reveal_transparent.gif';
    const GIF_SCALE = 0.76;         // size of the opening GIF compared to the letter (bigger = larger envelope)
    const GIF_NUDGE_X = 0;          // fine-tune the GIF's position in pixels (+ moves right, - moves left)
    const GIF_NUDGE_Y = 0;          // (+ moves down, - moves up)
    const GIF_FALLBACK_MS = 3000;   // used only if the script can't read the GIF's real length
    const GIF_EARLY = 1000;         // start the fade this many ms BEFORE the GIF finishes (bigger = earlier)
    const FADE_MS = 800;            // length of the fade into the next page

    const DROP_FPS = 6;             // speed of frames 1-13 (13 frames = about 2.2 seconds)
    const BOB_MS = 450;             // how fast frames 14-15 swap
    const START_SCALE = 0.3;        // how small the letter is when it starts falling (1 = full size)
    const BOB_HEIGHT = 4;           // how far the letter floats up and down (% of its own height)
    const BOB_SPEED = 1600;         // time for one full up and down, in ms

    const rider = document.querySelector('.rider');
    const letter = document.querySelector('.letter');
    const fade = document.querySelector('.fade');
    fade.style.transition = `opacity ${FADE_MS}ms ease`;

    const dropFrames = Array.from({ length: 13 }, (_, i) => `../image/Lframe${i + 1}.png`);
    const bobFrames = ['../image/Lframe14.png', '../image/Lframe15.png'];

    // preload every frame and the GIF so nothing flickers or lags
    [...dropFrames, ...bobFrames, OPEN_GIF].forEach(src => { new Image().src = src; });

    // ---------- find where the envelope sits inside an image ----------
    // returns the envelope's horizontal center and bottom edge as fractions of the image, plus its shape
    async function measure(src) {
      try {
        const img = new Image();
        img.src = src;
        await img.decode();
        const w = img.naturalWidth, h = img.naturalHeight;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, w, h).data;

        let minX = w, maxX = -1, maxY = -1;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (d[(y * w + x) * 4 + 3] > 128) {       // visible pixel
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX < 0) return null;
        return { cx: (minX + maxX + 1) / 2 / w, bottom: (maxY + 1) / h, aspect: h / w };
      } catch (e) {
        return null;      // for example when opening the file directly from the computer
      }
    }

    const measures = {};
    [...bobFrames, OPEN_GIF].forEach(src => {
      measure(src).then(m => { measures[src] = m; });
    });

    // ---------- prepare the GIF: read its length and make it play only once ----------
    let gifMs = GIF_FALLBACK_MS;
    let gifSrc = OPEN_GIF;          // replaced by a "play once" copy when it's ready

    async function prepareGif(url) {
      try {
        const res = await fetch(url);
        const buf = new Uint8Array(await res.arrayBuffer());

        // 1) add up every frame's delay to get the real length
        let ms = 0;
        for (let i = 0; i < buf.length - 7; i++) {
          if (buf[i] === 0x21 && buf[i + 1] === 0xF9 && buf[i + 2] === 0x04 && buf[i + 7] === 0x00) {
            const d = buf[i + 4] | (buf[i + 5] << 8);          // delay in 1/100 s
            ms += (d <= 1 ? 10 : d) * 10;                      // browsers treat 0-1 as 100 ms
          }
        }
        if (ms >= 200) gifMs = ms;

        // 2) switch off the loop setting so the GIF stops on its last frame
        const tag = 'NETSCAPE2.0';
        for (let i = 0; i < buf.length - tag.length; i++) {
          let match = true;
          for (let j = 0; j < tag.length; j++) {
            if (buf[i + j] !== tag.charCodeAt(j)) { match = false; break; }
          }
          if (match) { buf[i] = 0x58; break; }                 // renames the loop marker so browsers ignore it
        }
        gifSrc = URL.createObjectURL(new Blob([buf], { type: 'image/gif' }));
      } catch (e) {
        // if anything fails, the original GIF is used (it will loop)
      }
    }
    prepareGif(OPEN_GIF);

    let timer = null;
    let bobAnim = null;
    let opened = false;

    // ---------- open the letter, then fade to the next page ----------
    function openLetter() {
      if (opened) return;
      opened = true;

      clearInterval(timer);                 // stop swapping frames 14-15
      if (bobAnim) bobAnim.pause();         // freeze the floating where it is

      // where the letter is on screen right now
      const rect = letter.getBoundingClientRect();
      const current = measures[letter.getAttribute('src')];
      const gif = measures[OPEN_GIF];

      // size of the GIF on screen
      const gifW = rect.width * GIF_SCALE;
      const gifH = gifW * (gif ? gif.aspect : 252 / 378);

      // place the GIF so its envelope lines up with the current envelope
      let left, top;
      if (current && gif) {
        const envCenterX = rect.left + current.cx * rect.width;
        const envBottom = rect.top + current.bottom * rect.height;
        left = envCenterX - gif.cx * gifW;
        top = envBottom - gif.bottom * gifH;
      } else {
        // fallback when the images can't be measured: center the GIF on the letter
        left = rect.left + (rect.width - gifW) / 2;
        top = rect.top + (rect.height - gifH) / 2;
      }

      // stop the drop/bob animations and switch to plain positioning
      letter.getAnimations().forEach(a => a.cancel());
      Object.assign(letter.style, {
        transform: 'none',
        translate: 'none',
        scale: 'none',
        aspectRatio: 'auto',
        bottom: 'auto',
        width: gifW + 'px',
        height: gifH + 'px',
        left: (left + GIF_NUDGE_X) + 'px',
        top: (top + GIF_NUDGE_Y) + 'px'
      });

      letter.classList.remove('ready');
      letter.src = gifSrc;                  // plays the opening GIF once and stops on its last frame

      // wait for the GIF to finish, hold the last frame, then fade out
      const fadeStart = Math.max(0, gifMs - GIF_EARLY);
      setTimeout(() => fade.classList.add('show'), fadeStart);
      setTimeout(() => { window.location.href = OPEN_PAGE; }, fadeStart + FADE_MS);
    }

    function makeClickable() {
      letter.classList.add('ready');
      letter.setAttribute('role', 'link');
      letter.tabIndex = 0;                                             // reachable with the keyboard
      letter.addEventListener('click', openLetter);
      letter.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') openLetter();
      });
    }

    function startBobbing() {
      let b = 0;
      letter.src = bobFrames[0];

      // swap frames 14 and 15
      timer = setInterval(() => {
        b = (b + 1) % bobFrames.length;
        letter.src = bobFrames[b];
      }, BOB_MS);

      // smooth float up and down
      bobAnim = letter.animate(
        [
          { translate: '0 0' },
          { translate: `0 -${BOB_HEIGHT}%` }
        ],
        {
          duration: BOB_SPEED / 2,
          direction: 'alternate',
          iterations: Infinity,
          easing: 'ease-in-out'
        }
      );

      makeClickable();            // the drop is done, so the letter can be clicked
    }

    function playDrop(x) {
      clearInterval(timer);
      letter.style.left = x + 'px';
      letter.style.display = 'block';
      letter.src = dropFrames[0];

      // grow from small to full size over the whole fall
      const fallMs = dropFrames.length * (1000 / DROP_FPS);
      letter.animate(
        [
          { transform: `translateX(-50%) scale(${START_SCALE})` },
          { transform: 'translateX(-50%) scale(1)' }
        ],
        { duration: fallMs, easing: 'ease-in', fill: 'forwards' }
      );

      let i = 0;
      timer = setInterval(() => {
        i++;
        if (i < dropFrames.length) {
          letter.src = dropFrames[i];
        } else {
          clearInterval(timer);
          startBobbing();         // drop finished, switch to bobbing
        }
      }, 1000 / DROP_FPS);
    }

    // watch the rider and drop the letter when it crosses the middle of the screen
    let prevX = null;
    let dropped = false;

    function tick() {
      const r = rider.getBoundingClientRect();
      const x = r.left + r.width / 2;
      const mid = window.innerWidth / 2;

      if (prevX !== null && prevX > mid && x <= mid) {
        dropped = true;
        playDrop(x);
      }
      prevX = x;

      if (!dropped) requestAnimationFrame(tick);   // stop checking after the drop
    }
    requestAnimationFrame(tick);

    // if the visitor presses Back, make sure the page isn't stuck on the fade color
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) fade.classList.remove('show');
    });
  </script>
</body>
</html>
